<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JefazoBox</title>
    <!-- Incluimos HLS.js para reproducir los canales .m3u8 -->
    <script src="hls.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENÚ LATERAL DE CANALES -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">📺 JefazoBox TV</div>
        <div class="channels-list" id="channelsList"></div>
    </div>

    <!-- PANTALLA DERECHA: REPRODUCTOR -->
    <div class="main-content" id="mainContent">
        <div class="video-container" id="videoContainer">
            <div id="loadingOverlay" class="loading-overlay">
                <div class="spinner"></div>
                <span id="loadingText">Cargando transmisión...</span>
            </div>
            <div id="zappingOsd" class="zapping-osd">Canal 1</div>
            <video id="videoPlayer" controls autoplay playsinline></video>
        </div>
    </div>

    <!-- ARCHIVOS SEPARADOS -->
    <script src="channels.js"></script>
    <script src="app.js"></script>
</body>
</html>
