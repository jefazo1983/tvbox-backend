<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JefazoBox TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🌟 SPLASH SCREEN PERSONALIZADO -->
    <div id="customSplash" class="custom-splash">
        <div class="splash-content">
            <div class="splash-logo-container">
                <svg class="splash-svg-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="4" width="20" height="15" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
                    <path d="M12 19V22M8 22H16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
                    <path d="M10 9L15 11.5L10 14V9Z" fill="#ffffff"/>
                </svg>
            </div>
            <h1>JefazoBox TV</h1>
            <p>Cargando tu entretenimiento...</p>
            <div class="splash-spinner"></div>
        </div>
    </div>

    <!-- MENÚ LATERAL DE CANALES -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="header-brand">
                <svg class="header-svg-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="2" y="4" width="20" height="15" rx="3" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
                    <path d="M12 19V22M8 22H16" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
                    <path d="M10 9L15 11.5L10 14V9Z" fill="#ffffff"/>
                </svg>
                <span>JefazoBox <span class="badge">PRO</span></span>
            </div>
        </div>
        <div class="channels-list" id="channelsList"></div>
    </div>

    <!-- PANTALLA DERECHA: REPRODUCTOR -->
    <div class="main-content" id="mainContent">
        <div class="video-container" id="videoContainer">
            <div id="loadingOverlay" class="loading-overlay">
                <div class="spinner"></div>
                <span id="loadingText">Cargando transmisión...</span>
            </div>
            <div id="zappingOsd" class="zapping-osd">Canal 1</div>
            
            <!-- BOTÓN FLOTANTE PARA PANTALLA COMPLETA -->
            <button id="fullscreenBtn" class="fullscreen-btn" title="Pantalla Completa">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>

            <!-- SE AÑADIÓ CONTROLS PARA QUE APAREZCAN LAS OPCIONES DE VIDEO -->
            <video id="videoPlayer" controls autoplay playsinline></video>
        </div>
    </div>

    <script src="channels.js"></script>
    <script src="app.js"></script>
</body>
</html>
