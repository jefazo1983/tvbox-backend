<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JefazoBox TV</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🌟 TU PROPIO SPLASH SCREEN PERSONALIZADO -->
    <div id="customSplash" class="custom-splash">
        <div class="splash-content">
            <!-- Puedes cambiar esta imagen por el enlace de tu propio logo -->
            <img src="https://i.imgur.com/8359y87.png" alt="Logo" class="splash-logo">
            <h1>JefazoBox TV</h1>
            <p>Cargando tu entretenimiento...</p>
            <div class="splash-spinner"></div>
        </div>
    </div>

    <!-- MENÚ LATERAL DE CANALES -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-icon">⚡</span> JefazoBox <span class="badge">PRO</span>
        </div>
        <div class="channels-list" id="channelsList"></div>
    </div>

    <!-- PANTALLA DERECHA: REPRODUCTOR -->
    <div class="main-content" id="mainContent">
        <div class="video-container" id="videoContainer">
            <div id="loadingOverlay" class="loading-overlay">
                <div class="spinner"></div>
                <span id="loadingText">Cargando transmisión...</span>
            </div>
            <div id="zappingOsd" class="zapping-osd">Canal 1</div>
            <video id="videoPlayer" autoplay playsinline></video>
        </div>
    </div>

    <script src="channels.js"></script>
    <script src="app.js"></script>
</body>
</html>
