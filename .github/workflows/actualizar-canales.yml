name: Actualizar Channels.js

on:
  workflow_dispatch:
    inputs:
      nuevo_parametro:
        description: 'Nuevo texto IP y token (ej: 181.115.161.231&token=abc...)'
        required: true
        type: string

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Ejecutar script de actualización
        run: |
          python escanear_lista.py --nuevo "${{ github.event.inputs.nuevo_parametro }}"

      - name: Hacer commit y push de los cambios
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add channels.js
          git commit -m "Actualización automática de canales via GitHub Actions"
          git push
