<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JefazoBox TV</title>
    <!-- HLS.js por CDN para asegurar compatibilidad total sin depender de archivos locales rotos -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MENÚ LATERAL DE CANALES -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="logo-icon">⚡</span> JefazoBox <span class="badge">PRO</span>
        </div>
        <div class="channels-list" id="channelsList"></div>
    </div>

    <!-- PANTALLA DERECHA: REPRODUCTOR -->
    <div class="main-content" id="mainContent">
        <div class="video-container" id="videoContainer">
            <div id="loadingOverlay" class="loading-overlay">
                <div class="spinner"></div>
                <span id="loadingText">Cargando transmisión...</span>
            </div>
            <div id="zappingOsd" class="zapping-osd">Canal 1</div>
            <!-- Se quita 'controls' nativo para que luzca como app de TV limpia -->
            <video id="videoPlayer" autoplay playsinline></video>
        </div>
    </div>

    <!-- ARCHIVOS SEPARADOS -->
    <script src="channels.js"></script>
    <script src="app.js"></script>
</body>
</html>
